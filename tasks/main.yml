---
- name: "Validate Barman execution context"
  ansible.builtin.include_tasks: validate_platform.yml

- name: "Set requested Barman state"
  ansible.builtin.set_fact:
    barman_state: "{{ state | default('present') }}"

- name: "Validate Barman inventory"
  ansible.builtin.include_tasks: validate_inventory.yml

- name: "Set Barman variables"
  ansible.builtin.set_fact:
    barman_package_module_interpreter: >-
      {{ ansible_facts['python']['executable'] | default('/usr/bin/python3') }}
    barman_global_config: "{{ iac_blueprint.barman.global_config | default({}) }}"
    barman_servers: "{{ iac_blueprint.barman.servers | default([]) }}"

- name: "STATE: Ensure Barman is installed and configured"
  ansible.builtin.include_tasks: install.yml
  when: barman_state == 'install'

- name: "STATE: Ensure Barman is uninstalled"
  ansible.builtin.include_tasks: uninstall.yml
  when: barman_state == 'uninstall'

- name: "STATE: Ensure Barman packages and configuration are present"
  ansible.builtin.include_tasks: present.yml
  when: barman_state == 'present'

- name: "STATE: Ensure Barman packages and configuration are absent"
  ansible.builtin.include_tasks: absent.yml
  when: barman_state == 'absent'

- name: "STATE: Ensure configured Barman servers are present"
  ansible.builtin.include_tasks: servers_present.yml
  when: barman_state == 'servers_present'

- name: "STATE: Ensure configured Barman servers are absent"
  ansible.builtin.include_tasks: servers_absent.yml
  when: barman_state == 'servers_absent'

- name: "STATE: Validate Barman inventory"
  ansible.builtin.debug:
    msg: "Barman inventory validation completed successfully"
  when: barman_state == 'validate'
