---
###############################################################################
#
# DEFAULT CONFIGURATION FOR THE ROLE
#
# Set deployment-specific values in inventory, a playbook, or group vars.
#
###############################################################################

http_proxy: ""
https_proxy: ""
no_proxy: ""

iac_supported_os:
  - { name: "Rocky", versions: ["8", "9", "10"] }
  - { name: "RedHat", versions: ["8", "9", "10"] }

dnf_sslverify: true
dnf_validate_certs: true
dnf_disable_gpg_check: false
dnf_update_cache: true
barman_disable_gpg_check: false
barman_update_cache: true
barman_repo_network_retries: 3
barman_repo_network_delay: 5
barman_el8_dnf_interpreter: "/usr/libexec/platform-python"

barman_dnf_repo_path: "/etc/yum.repos.d/pgdg-redhat-all.repo"
barman_repo_key_url: "https://download.postgresql.org/pub/repos/yum/keys/PGDG-RPM-GPG-KEY-RHEL"
barman_repo_package_url: >-
  https://download.postgresql.org/pub/repos/yum/reporpms/EL-
  {{ ansible_facts['distribution_major_version'] }}-x86_64/pgdg-redhat-repo-latest.noarch.rpm
barman_repo_id: "pgdg-common"

barman_package_name: "barman"
barman_cli_package_name: "barman-cli"
barman_install_cli: true

barman_os_user: "barman"
barman_os_group: "barman"
barman_home: "/var/lib/barman"
barman_config_path: "/etc/barman.conf"
barman_server_config_dir: "/etc/barman.d"
barman_log_directory: "/var/log/barman"
barman_data_directory: "/var/lib/barman"
barman_run_directory: "/var/run/barman"
barman_config_mode: "0640"

barman_global_config: {}
barman_servers: []

iac_service_name: "barman"
iac_ansible_report: true
iac_ansible_report_tasks_path: "/root/ansible-report-tasks.log"
